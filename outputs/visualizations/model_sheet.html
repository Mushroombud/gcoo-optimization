<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data and Model Sheet</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #5d687a;
      --line: #d9e0ea;
      --panel: #ffffff;
      --accent: #0f766e;
      --accent-dark: #0f4f4a;
      --code: #0f172a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: var(--ink);
    }
    header {
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      max-width: 1040px;
      margin: 0 auto;
      padding: 16px 20px;
    }
    .back,
    .raw-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }
    .back:hover,
    .raw-link:hover {
      color: var(--accent-dark);
      text-decoration: underline;
    }
    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 34px 20px 56px;
    }
    .document {
      max-width: 860px;
    }
    .loading,
    .error {
      padding: 18px 0;
      color: var(--muted);
      line-height: 1.65;
    }
    .error {
      color: #a43f18;
      font-weight: 650;
    }
    h1,
    h2,
    h3,
    h4 {
      color: var(--ink);
      line-height: 1.25;
    }
    h1 {
      margin: 0 0 22px;
      font-size: 32px;
    }
    h2 {
      margin: 34px 0 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      font-size: 24px;
    }
    h3 {
      margin: 28px 0 10px;
      font-size: 19px;
    }
    h4 {
      margin: 22px 0 8px;
      font-size: 16px;
    }
    p,
    li {
      color: #283548;
      font-size: 16px;
      line-height: 1.72;
    }
    p {
      margin: 0 0 14px;
    }
    ul {
      margin: 0 0 16px 22px;
      padding: 0;
    }
    li {
      margin: 6px 0;
    }
    code {
      border-radius: 5px;
      background: #e9eef5;
      color: #0f4f4a;
      padding: 2px 5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.92em;
    }
    pre {
      margin: 16px 0 20px;
      padding: 16px 18px;
      overflow-x: auto;
      border-radius: 8px;
      background: var(--code);
      color: #e2e8f0;
      line-height: 1.6;
      font-size: 13px;
    }
    pre code {
      background: transparent;
      color: inherit;
      padding: 0;
      border-radius: 0;
      font-size: inherit;
    }
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      margin: 16px 0 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 520px;
    }
    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 14px;
      line-height: 1.55;
    }
    th {
      background: #eef4f4;
      color: var(--accent-dark);
      font-weight: 750;
    }
    tr:last-child td {
      border-bottom: 0;
    }
    hr {
      height: 1px;
      margin: 28px 0;
      border: 0;
      background: var(--line);
    }
    a {
      color: var(--accent);
    }
    @media (max-width: 680px) {
      .bar {
        align-items: flex-start;
        flex-direction: column;
      }
      main {
        padding: 26px 16px 44px;
      }
      h1 { font-size: 26px; }
      h2 { font-size: 21px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="back" href="./index.html">Visualization index</a>
      <a class="raw-link" href="./Data_Model_Sheet.md">Raw Markdown</a>
    </div>
  </header>
  <main>
    <article id="content" class="document">
      <p class="loading">Data_Model_Sheet.md를 불러오는 중입니다.</p>
    </article>
  </main>
  <script>
    const sourcePath = "./Data_Model_Sheet.md";
    const content = document.getElementById("content");

    fetch(sourcePath, { cache: "no-store" })
      .then((response) => {
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }
        return response.arrayBuffer();
      })
      .then((buffer) => {
        return new TextDecoder("utf-8", { fatal: true }).decode(buffer);
      })
      .then((markdown) => {
        content.innerHTML = renderMarkdown(markdown);
      })
      .catch((error) => {
        content.innerHTML = '<p class="error">Data_Model_Sheet.md를 불러오지 못했습니다: ' + escapeHtml(error.message) + '</p>';
      });

    function escapeHtml(value) {
      return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderInline(value) {
      let html = escapeHtml(value);
      html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
      html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_match, text, href) => {
        const safeHref = href.trim().toLowerCase().startsWith("javascript:") ? "#" : href.trim();
        return '<a href="' + escapeHtml(safeHref) + '">' + text + '</a>';
      });
      return html;
    }

    function renderMarkdown(markdown) {
      const lines = markdown.replace(/\r\n/g, "\n").split("\n");
      const out = [];
      let paragraph = [];
      let list = [];
      let table = [];
      let code = [];
      let inCode = false;

      function flushParagraph() {
        if (paragraph.length === 0) return;
        out.push("<p>" + renderInline(paragraph.join(" ")) + "</p>");
        paragraph = [];
      }

      function flushList() {
        if (list.length === 0) return;
        out.push("<ul>" + list.map((item) => "<li>" + renderInline(item) + "</li>").join("") + "</ul>");
        list = [];
      }

      function splitTableRow(row) {
        const trimmed = row.trim().replace(/^\|/, "").replace(/\|$/, "");
        return trimmed.split("|").map((cell) => cell.trim());
      }

      function isSeparator(row) {
        return /^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(row.trim());
      }

      function flushTable() {
        if (table.length === 0) return;
        if (table.length < 2 || !isSeparator(table[1])) {
          paragraph.push(...table);
          table = [];
          return;
        }
        const headers = splitTableRow(table[0]);
        const rows = table.slice(2).map(splitTableRow);
        let html = '<div class="table-wrap"><table><thead><tr>';
        html += headers.map((cell) => "<th>" + renderInline(cell) + "</th>").join("");
        html += "</tr></thead><tbody>";
        html += rows.map((row) => "<tr>" + row.map((cell) => "<td>" + renderInline(cell) + "</td>").join("") + "</tr>").join("");
        html += "</tbody></table></div>";
        out.push(html);
        table = [];
      }

      for (const line of lines) {
        const trimmed = line.trim();

        if (trimmed.startsWith("```")) {
          if (inCode) {
            out.push("<pre><code>" + escapeHtml(code.join("\n")) + "</code></pre>");
            code = [];
            inCode = false;
          } else {
            flushTable();
            flushList();
            flushParagraph();
            inCode = true;
          }
          continue;
        }

        if (inCode) {
          code.push(line);
          continue;
        }

        if (trimmed === "") {
          flushTable();
          flushList();
          flushParagraph();
          continue;
        }

        if (trimmed === "---") {
          flushTable();
          flushList();
          flushParagraph();
          out.push("<hr>");
          continue;
        }

        if (trimmed.includes("|") && trimmed.startsWith("|")) {
          flushList();
          flushParagraph();
          table.push(line);
          continue;
        }

        const heading = /^(#{1,6})\s+(.+)$/.exec(trimmed);
        if (heading) {
          flushTable();
          flushList();
          flushParagraph();
          const level = Math.min(4, heading[1].length);
          out.push("<h" + level + ">" + renderInline(heading[2]) + "</h" + level + ">");
          continue;
        }

        const bullet = /^[-*]\s+(.+)$/.exec(trimmed);
        if (bullet) {
          flushTable();
          flushParagraph();
          list.push(bullet[1]);
          continue;
        }

        flushTable();
        flushList();
        paragraph.push(line);
      }

      if (inCode) {
        out.push("<pre><code>" + escapeHtml(code.join("\n")) + "</code></pre>");
      }
      flushTable();
      flushList();
      flushParagraph();
      return out.join("\n");
    }
  </script>
</body>
</html>
